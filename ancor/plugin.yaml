name: ancor
version: 2.1.0
description: Human-intent alignment on default profile + thin deterministic substrate, generic resource budgets, recursive /goal tree on ancor-exec, and independent delivery Judge.
provides_tools:
  - ancor_overview
  - ancor_request_get
  - ancor_request_read
  - ancor_event_get
  - ancor_event_ack
  - ancor_change_get
  - ancor_change_history
  - ancor_change_propose
  - ancor_question_list
  - ancor_question_get
  - ancor_question_create
  - ancor_question_withdraw
  - ancor_notification_list
  - ancor_notification_get
  - ancor_notification_respond
  - ancor_request_pause_propose
  - ancor_request_resume_propose
  - ancor_request_cancel_propose
  - ancor_request_accept_propose
  - ancor_request_changes_propose
  - ancor_request_advance
  - ancor_signal_propose
  - ancor_note_list
  - ancor_note_get
  - ancor_note_history
  - ancor_note_add
  - ancor_note_update
  - ancor_note_delete
  - ancor_completion_send
  - ancor_goal_list
  - ancor_goal_get
  - ancor_goal_self
  - ancor_goal_spawn
  - ancor_goal_signal
  - ancor_goal_pause
  - ancor_goal_resume
  - ancor_goal_stop
  - ancor_goal_report
  - ancor_resource_acquire
  - ancor_cluster_status
  - ancor_delivery_submit
  - ancor_judge_verdict
  - ancor_visualize
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - post_api_request
config_schema:
  interactor_profile:
    type: string
    default: default
  exec_profile:
    type: string
    default: ancor-exec
  exec_config_path:
    type: string
  category_reasoning:
    type: object
  owner_profile:
    type: string
    default: default
  gateway_owner:
    type: boolean
    default: false
  poll_interval:
    type: number
    default: 15
  event_batch_size:
    type: integer
    minimum: 1
    maximum: 32
    default: 12
  max_judge_rejects:
    type: integer
    minimum: 1
    default: 3
  global_limits:
    type: object
  cluster_state_path:
    type: string
  human_target:
    type: string
  transport_profile:
    type: string
  store_path:
    type: string
