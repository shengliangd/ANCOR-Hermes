name: ancor
version: 0.1.0
description: Durable requirements and leader acceptance over native Hermes Kanban.
provides_tools:
  - ancor_requirement
  - ancor_get_context
  - ancor_acceptance
  - ancor_board
  - ancor_notify
provides_hooks:
  - pre_tool_call
  - post_tool_call
config_schema:
  leader_profile:
    type: string
    default: ancor-leader
  owner_profile:
    type: string
    default: default
  gateway_owner:
    type: boolean
    default: false
  board:
    type: string
    default: ancor
  worker_profile:
    type: string
    default: ancor-worker
  poll_interval:
    type: number
    default: 15
  human_target:
    type: string
  transport_profile:
    type: string
  sender_executable:
    type: string
    default: hermes
  store_path:
    type: string
