name: ancor
version: 0.4.0
description: Durable requirements and interactor/coordinator workflow over native Hermes Kanban.
provides_tools:
  - ancor_requirement
  - ancor_get_context
  - ancor_ack_events
  - ancor_acceptance
  - ancor_board
  - ancor_notify
  - ancor_wake
  - ancor_note
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
config_schema:
  interactor_profile:
    type: string
    default: ancor-interactor
  coordinator_profile:
    type: string
    default: ancor-coordinator
  owner_profile:
    type: string
    default: default
  gateway_owner:
    type: boolean
    default: false
  board:
    type: string
    default: ancor
  worker_profile:
    type: string
    default: ancor-worker
  poll_interval:
    type: number
    default: 30
  human_target:
    type: string
  transport_profile:
    type: string
  store_path:
    type: string
