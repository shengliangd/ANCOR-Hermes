[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ancor"
version = "3.0.0a1"
description = "AI-Native Coordination Runtime — CLI-neutral multi-backend orchestration for long-running agent work."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "mcp>=1.0",
]

[project.scripts]
ancor = "ancor.cli.main:main"

[tool.setuptools.packages.find]
include = ["ancor*"]

[tool.setuptools.package-data]
ancor = ["dashboard/dist/*", "dashboard/manifest.json", "plugin.yaml"]
